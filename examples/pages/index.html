<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>PuPHPeteer example</title></head>
<body>
  <h1>PuPHPeteer example</h1>
  <button id="button" type="button">Go</button>
  <div id="result"></div>
  <script>
    document.querySelector('#button').addEventListener('click', () => {
      document.querySelector('#result').textContent = 'clicked';
    });
  </script>
</body>
</html>
