name: QuickJS foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit-and-types:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      # Unit tests run without the extension; Psalm uses stubs. Browser integration is separate.
      - name: Install latest supported dependencies
        run: composer update --prefer-stable --ignore-platform-req=ext-php_quickjs --no-interaction --no-progress --prefer-dist
      - run: npm ci
      - run: npm run build:check
      - run: npm run test-generator
      - run: composer verify-php
      - run: composer test-unit
      - run: composer psalm
