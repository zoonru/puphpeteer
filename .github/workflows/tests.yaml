name: QuickJS validation
on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  unit-and-types:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - name: Locate Composer cache
        id: composer-cache
        run: echo "path=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.path }}
          key: composer-${{ runner.os }}-${{ matrix.php-version }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php-version }}-
      - name: Install latest supported PHP dependencies
        id: composer-install
        run: composer update --prefer-stable --ignore-platform-req=ext-php_quickjs --no-interaction --no-progress --prefer-dist
      - run: php vendor/bin/phpunit
      - run: composer psalm
        if: ${{ !cancelled() && steps.composer-install.outcome == 'success' }}

  javascript:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - run: composer update --prefer-stable --ignore-platform-req=ext-php_quickjs --no-interaction --no-progress --prefer-dist
      - run: npm ci
      - run: npm run build:check
      - run: npm run test-generator
      - run: npm run test-plugins
      - run: composer verify-php

  docker:
    env:
      COMPOSE_PROJECT_NAME: puphpeteer
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build prepared environments
        id: build
        uses: docker/bake-action@v6
        with:
          files: compose.yaml
          targets: php,chrome
          load: true
          set: |
            php.args.PHP_VERSION=${{ matrix.php-version }}
            php.cache-from=type=gha,scope=php-${{ matrix.php-version }}
            php.cache-to=type=gha,mode=max,scope=php-${{ matrix.php-version }}
            chrome.cache-from=type=gha,scope=chrome-${{ matrix.php-version }}
            chrome.cache-to=type=gha,mode=max,scope=chrome-${{ matrix.php-version }}
      - name: Install project dependencies
        id: dependencies
        run: |
          docker run --rm --init --user "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp/composer -v "$PWD:/app" puphpeteer-base composer install --no-interaction --prefer-dist
          docker run --rm --init --user "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp/composer -v "$PWD:/app" puphpeteer-base npm ci --cache /tmp/npm
      - name: Functional test suite
        if: ${{ github.event_name != 'release' }}
        run: docker run --rm --init --user "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp/composer -v "$PWD:/app" --shm-size=1g --cap-add=SYS_ADMIN -e XDG_CONFIG_HOME=/tmp/chrome-config puphpeteer-chrome php bin/console test all --no-interaction
      - name: Full release suite
        if: ${{ github.event_name == 'release' }}
        run: docker run --rm --init --user "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp/composer -v "$PWD:/app" --shm-size=1g --cap-add=SYS_ADMIN -e XDG_CONFIG_HOME=/tmp/chrome-config puphpeteer-chrome composer test-release -- --cycles=50 --timeout=600
      - name: Check browserless example
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          docker compose up -d browserless
          for attempt in $(seq 1 30); do
            if docker run --rm --init --user "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp/composer -v "$PWD:/app" --network puphpeteer_default -e "BROWSER_WS=ws://browserless:3000?token=local-tests" puphpeteer-base php examples/03_browserless.php; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Browserless failure boundaries
        run: docker run --rm --init --user "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp/composer -v "$PWD:/app" --network puphpeteer_default -e "BROWSER_WS=ws://browserless:3000?token=local-tests" puphpeteer-base php tests/Browser/Puppeteer/browserless.php
      - name: Benchmark
        if: ${{ github.event_name == 'release' }}
        run: docker run --rm --init --user "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp/composer -v "$PWD:/app" --shm-size=1g --cap-add=SYS_ADMIN -e XDG_CONFIG_HOME=/tmp/chrome-config puphpeteer-chrome composer benchmark -- --trials=5 --iterations=1000
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
